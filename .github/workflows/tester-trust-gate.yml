name: Tester Trust Gate

on:
  pull_request:
    paths:
      - 'gold_cio_v9/validation/**'
      - 'gold_cio_v9/backtest/**'
      - 'gold_cio_v9/features/**'
      - 'gold_cio_v9/labels/**'
      - 'gold_cio_v9/config/tester_trust_gate.yaml'
      - 'gold_cio_v9/tests/**'
      - '.github/workflows/tester-trust-gate.yml'
  push:
    branches:
      - gold-cio-v9
    paths:
      - 'gold_cio_v9/validation/**'
      - 'gold_cio_v9/backtest/**'
      - 'gold_cio_v9/features/**'
      - 'gold_cio_v9/labels/**'
      - 'gold_cio_v9/config/tester_trust_gate.yaml'
      - 'gold_cio_v9/tests/**'
      - '.github/workflows/tester-trust-gate.yml'

jobs:
  trust-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml numpy

      - name: Test 4 - Known-answer synthetic verdicts
        run: pytest -q gold_cio_v9/tests/trust/test_known_answer.py

      - name: Test 1 - Leakage detection and purge integrity
        run: pytest -q gold_cio_v9/tests/trust/test_leakage.py

      - name: Test 2 - Deterministic replay
        run: pytest -q gold_cio_v9/tests/trust/test_determinism.py

      - name: Test 3 - Trials registry completeness
        run: pytest -q gold_cio_v9/tests/trust/test_trials_registry.py

      - name: Test 5 - Config immutability
        run: pytest -q gold_cio_v9/tests/trust/test_config_immutability.py

      - name: Trust gate summary
        if: success()
        run: echo 'CAN_TRUST_TESTER=YES'

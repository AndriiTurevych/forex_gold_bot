name: Tester Trust Gate

on:
  pull_request:
    paths:
      - 'gold_cio_v9/__init__.py'
      - 'gold_cio_v9/validation/**'
      - 'gold_cio_v9/backtest/**'
      - 'gold_cio_v9/features/**'
      - 'gold_cio_v9/ict_engine/**'
      - 'gold_cio_v9/labels/**'
      - 'gold_cio_v9/experiments/**'
      - 'gold_cio_v9/config/tester_trust_gate.yaml'
      - 'gold_cio_v9/tests/**'
      - '.github/workflows/tester-trust-gate.yml'
  push:
    branches:
      - gold-cio-v9
    paths:
      - 'gold_cio_v9/__init__.py'
      - 'gold_cio_v9/validation/**'
      - 'gold_cio_v9/backtest/**'
      - 'gold_cio_v9/features/**'
      - 'gold_cio_v9/ict_engine/**'
      - 'gold_cio_v9/labels/**'
      - 'gold_cio_v9/experiments/**'
      - 'gold_cio_v9/config/tester_trust_gate.yaml'
      - 'gold_cio_v9/tests/**'
      - '.github/workflows/tester-trust-gate.yml'
  workflow_dispatch:

jobs:
  trust-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONHASHSEED: '1729'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pyyaml numpy

      - name: Test 4 - Known-answer synthetic verdicts
        run: python -m pytest -q gold_cio_v9/tests/trust/test_known_answer.py

      - name: Test 1A - Explicit leakage and purge integrity
        run: python -m pytest -q gold_cio_v9/tests/trust/test_leakage.py

      - name: Test 1B - ICT confirmation-delay and state-revision leakage
        run: python -m pytest -q gold_cio_v9/tests/trust/test_ict_confirmation_leakage.py

      - name: Test 2 - Deterministic replay
        run: python -m pytest -q gold_cio_v9/tests/trust/test_determinism.py

      - name: Test 3 - Trials registry completeness
        run: python -m pytest -q gold_cio_v9/tests/trust/test_trials_registry.py

      - name: Test 5 - Config immutability
        run: python -m pytest -q gold_cio_v9/tests/trust/test_config_immutability.py

      - name: Test 6 - Preregistration immutability and instrument scope
        run: python -m pytest -q gold_cio_v9/tests/trust/test_preregistration_immutability.py

      - name: Trust gate summary
        if: success()
        run: echo 'CAN_TRUST_TESTER=YES'

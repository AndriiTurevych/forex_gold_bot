name: Gold CIO Shadow Scheduler

on:
  schedule:
    - cron: "*/15 * * * 1-5"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/gold-cio-shadow-schedule.yml

permissions:
  actions: read
  contents: read

jobs:
  shadow:
    uses: AndriiTurevych/forex_gold_bot/.github/workflows/shadow-forward.yml@gold-cio-v9
    secrets: inherit

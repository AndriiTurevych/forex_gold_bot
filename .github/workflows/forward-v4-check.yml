name: EXP-0004 Causal Execution QA
on:
  pull_request:
    branches: [gold-cio-v9]
    paths:
      - 'gold_cio_v9/forward_v4.py'
      - 'scripts/forward_v4_cycle.py'
      - 'gold_cio_v9/tests/test_forward_v4.py'
      - 'gold_cio_v9/experiments/EXP-0004-DESIGN.md'
      - '.github/workflows/forward-v4-check.yml'
permissions:
  contents: read
jobs:
  causal-execution:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest pyyaml numpy
      - run: python -m pytest -q gold_cio_v9/tests/test_forward_v4.py gold_cio_v9/tests/test_shadow_system.py gold_cio_v9/tests/test_exp0002_structural_windows.py

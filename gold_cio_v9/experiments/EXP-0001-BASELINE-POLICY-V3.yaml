id: EXP-0001-BASELINE-POLICY-V3
experiment_id: EXP-0001
supersedes: EXP-0001-BASELINE-POLICY-V2
status: LOCKED_BEFORE_OUTCOMES
instrument: GC
frequency: 1m
reason_for_version: >
  V2 still relied on Massive historical active-only PIT snapshots to enumerate the
  candidate contract universe. Before strategy outcomes, real market-data QA found a
  GC contract with substantial completed-session volume absent from an active-only
  snapshot. V3 freezes an immutable outright-contract master registry and derives
  eligibility from fixed first/last trade and settlement dates instead of the
  provider active flag.
causal_inputs:
  atr_period: 14
  swing_left_bars: 2
  swing_right_bars: 2
  trend_rule: >
    BULLISH only when the latest two already-confirmed swing highs and latest two
    already-confirmed swing lows are both higher; BEARISH only when both are lower;
    mixed or insufficient structure is unclassified.
  htf_location_rule: >
    Use only the completed prior UTC day range. LONG permission requires retest
    close at or below the prior-day midpoint (discount). SHORT permission requires
    retest close at or above the prior-day midpoint (premium).
  reference_liquidity: prior_completed_day_high_low
labels:
  horizons_minutes: [5, 15, 30, 60]
  horizon_semantics: wall_clock_minutes_not_observed_bar_count
futures_chain:
  contract_registry: immutable_hash_bound_outright_gc_master
  provider_active_flag_used_for_eligibility: false
  eligibility_rule: first_trade_date_lte_as_of_lte_last_trade_date_minus_roll_buffer
  roll_buffer_days: 5
  max_settlement_days_forward: 365
  selection: highest_completed_prior_session_volume_within_master_eligible_universe
  missing_volume_policy: fail_closed_unless_completed_response_explicitly_means_zero
  tie_break: nearest_settlement_then_ticker
  current_session_volume_allowed: false
  open_interest_hindsight_allowed: false
  adjusted_continuous_prices_allowed: false
execution:
  setup_order: HTF_LOCATION_SWEEP_MSS_FVG_LATER_RETEST
  same_bar_fvg_retest_allowed: false
  cross_contract_outcomes_allowed: false
governance:
  tune_after_outcomes: false
  choose_best_horizon_post_hoc: false
  all_horizons_reported: true
